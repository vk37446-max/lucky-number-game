<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Number — Guessing Game</title>
  <style>
    :root { color-scheme: light; --ink:#20243a; --muted:#747a91; --purple:#7058e8; --pink:#ff7d9b; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:ui-rounded,"Segoe UI",system-ui,sans-serif; background:radial-gradient(ellipse at 14% 12%,#fff5d9 0 8%,transparent 30%),radial-gradient(ellipse at 90% 90%,#e6dcff 0 12%,transparent 35%),#f7f5ff; }
    .game { width:min(100%,470px); padding:38px; border:1px solid #ffffffc9; border-radius:30px; background:#ffffffd9; box-shadow:0 24px 70px #49389c18; text-align:center; backdrop-filter:blur(12px); }
    .badge { display:inline-flex; gap:8px; align-items:center; padding:8px 12px; border-radius:99px; background:#f0edff; color:#614bd0; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:19px 0 8px; font-size:clamp(34px,8vw,46px); letter-spacing:-.05em; line-height:1.04; }
    .subtitle { margin:0 auto 25px; max-width:310px; color:var(--muted); line-height:1.55; }
    .number { display:grid; place-items:center; width:106px; height:106px; margin:0 auto 24px; border-radius:32px; color:white; font-size:42px; font-weight:850; background:linear-gradient(145deg,var(--purple),#9b70f3); box-shadow:0 12px 25px #7058e844; transform:rotate(-4deg); }
    .number.pop { animation:pop .32s ease }
    @keyframes pop { 50% { transform:rotate(4deg) scale(1.1) } }
    .form { display:flex; gap:10px; }
    input { width:100%; min-width:0; padding:15px 16px; border:2px solid #eeecf7; border-radius:15px; color:var(--ink); background:white; font:700 16px inherit; font-size:16px; outline:none; transition:border-color .2s,box-shadow .2s; }
    input:focus { border-color:#a596f4; box-shadow:0 0 0 4px #7058e81a }
    button { border:0; border-radius:15px; padding:0 21px; color:white; background:var(--ink); font:inherit; font-weight:800; cursor:pointer; transition:transform .15s,background .15s; white-space:nowrap; }
    button:hover { transform:translateY(-2px); background:#3b3f5d }
    button:active { transform:scale(.97) }
    .message { min-height:27px; margin:18px 0 10px; color:#6853d4; font-weight:750; }
    .bottom { display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:19px; border-top:1px solid #efedf5; color:var(--muted); font-size:13px; }
    .reset { padding:8px 12px; border:1px solid #eae7f4; border-radius:11px; color:#5c5677; background:white; font-size:13px; }
    .reset:hover { background:#f8f6ff }
    @media(max-width:430px) { .game { padding:28px 22px; } .form { flex-direction:column } button { min-height:51px } }
  </style>
</head>
<body>
  <main class="game">
    <div class="badge">✨ A little guessing game</div>
    <h1>Lucky Number</h1>
    <p class="subtitle">I’m thinking of a number from <strong>1 to 20</strong>. Can you find it in five tries?</p>
    <div class="number" id="number" aria-hidden="true">?</div>
    <form class="form" id="guess-form">
      <input id="guess" type="number" min="1" max="20" placeholder="Enter a number" aria-label="Your guess" required autofocus>
      <button type="submit">Guess it →</button>
    </form>
    <p class="message" id="message" aria-live="polite">Make your first guess!</p>
    <div class="bottom"><span id="attempts">5 guesses left</span><button class="reset" id="reset" type="button">↻ Start over</button></div>
  </main>
  <script>
    const input = document.querySelector('#guess');
    const form = document.querySelector('#guess-form');
    const message = document.querySelector('#message');
    const attemptsText = document.querySelector('#attempts');
    const numberCard = document.querySelector('#number');
    let secret, remaining, finished;
    function newGame() {
      secret = Math.floor(Math.random() * 20) + 1;
      remaining = 5;
      finished = false;
      numberCard.textContent = '?';
      input.value = '';
      input.disabled = false;
      form.querySelector('button').disabled = false;
      message.textContent = 'Make your first guess!';
      attemptsText.textContent = '5 guesses left';
      input.focus();
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (finished) return;
      const guess = Number(input.value);
      if (!Number.isInteger(guess) || guess < 1 || guess > 20) {
        message.textContent = 'Choose a whole number from 1 to 20.';
        input.focus();
        return;
      }
      remaining--;
      if (guess === secret) {
        message.textContent = `🎉 You got it! The number was ${secret}.`;
        finish();
      } else if (remaining === 0) {
        message.textContent = `Game over! The number was ${secret}.`;
        finish();
      } else {
        message.textContent = guess < secret ? 'A little higher! ⬆️' : 'A little lower! ⬇️';
        attemptsText.textContent = `${remaining} ${remaining === 1 ? 'guess' : 'guesses'} left`;
        input.value = '';
        input.focus();
      }
      numberCard.classList.remove('pop');
      void numberCard.offsetWidth;
      numberCard.classList.add('pop');
    });
    function finish() {
      finished = true;
      numberCard.textContent = secret;
      attemptsText.textContent = 'Round complete';
      input.disabled = true;
    }
    document.querySelector('#reset').addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
